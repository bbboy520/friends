<!-- 
    修改密码页面 - change_password.html
    功能：选手可以修改自己的登录密码
    技术：HTML5 + Jinja2模板引擎
-->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>修改密码 - 长友杯辩论赛</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>长友杯辩论赛</h1>
            <p class="subtitle">赛果查询系统</p>
            <p class="theme-slogan">愿岁并谢，与长友兮</p>
            <div class="user-info">
                <span>欢迎，{{ user.name }} ({{ user.roles | join(', ') }})</span>
                <a href="/logout" class="btn btn-small btn-logout">登出</a>
            </div>
        </header>
        
        <nav class="main-nav">
            <a href="/" class="nav-item">首页</a>
            <a href="/ranking" class="nav-item">排行榜</a>
            <a href="/detail" class="nav-item">比赛详情</a>
            <a href="/history" class="nav-item">往届赛果</a>
            <a href="/vote" class="nav-item">投票</a>
        </nav>
        
        <main>
            <div class="card">
                <h2>修改密码</h2>
                
                {% if error %}
                <div class="alert alert-error">{{ error }}</div>
                {% endif %}
                
                {% if success %}
                <div class="alert alert-success">{{ success }}</div>
                {% endif %}
                
                <form action="/change_password" method="POST" class="change-password-form">
                    <div class="form-group">
                        <label for="old_password">原密码：</label>
                        <input type="password" name="old_password" id="old_password" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="new_password">新密码：</label>
                        <input type="password" name="new_password" id="new_password" required minlength="6">
                    </div>
                    
                    <div class="form-group">
                        <label for="confirm_password">确认新密码：</label>
                        <input type="password" name="confirm_password" id="confirm_password" required minlength="6">
                    </div>
                    
                    <div class="form-buttons">
                        <button type="submit" class="btn btn-primary">修改密码</button>
                        <a href="/" class="btn btn-secondary">返回首页</a>
                    </div>
                </form>
            </div>
        </main>
        
        <footer>
            <p>长友杯第二季辩论赛 &copy; 2026</p>
        </footer>
    </div>
</body>
</html>
