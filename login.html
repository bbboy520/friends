<!-- 
    登录页面 - login.html
    功能：用户登录界面，输入用户名和密码进行登录
    技术：HTML5 + CSS
    说明：所有用户都需要登录后才能使用系统
-->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 长友杯辩论赛</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>长友杯辩论赛</h1>
            <p class="subtitle">赛果查询系统</p>
            <p class="theme-slogan">愿岁并谢，与长友兮</p>
        </header>
        
        <div class="login-card">
            <h2>用户登录</h2>
            
            {% if error %}
            <div class="alert alert-error">{{ error }}</div>
            {% endif %}
            
            <form action="/login" method="POST" class="login-form">
                <div class="form-group">
                    <label for="username">用户名：</label>
                    <input type="text" name="username" id="username" placeholder="请输入用户名" required>
                </div>
                
                <div class="form-group">
                    <label for="password">密码：</label>
                    <input type="password" name="password" id="password" placeholder="请输入密码" required>
                </div>
                
                <button type="submit" class="btn btn-primary btn-login">登录</button>
            </form>
        
        <footer>
            <p>长友杯第二季辩论赛 &copy; 2026</p>
        </footer>
    </div>
</body>
</html>
